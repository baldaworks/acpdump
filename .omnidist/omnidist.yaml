profiles:
  acpdump:
    tool:
      name: acpdump
      main: ./cmd/acpdump
    readme-path: ./README.md
    version:
      source: git-tag
    targets:
      - os: darwin
        arch: amd64
      - os: darwin
        arch: arm64
      - os: linux
        arch: amd64
      - os: linux
        arch: arm64
      - os: windows
        arch: amd64
    build:
      ldflags: -s -w
      tags: []
      cgo: false
    distributions:
      npm:
        package: '@baldaworks/acpdump'
        registry: https://registry.npmjs.org
        access: public
        publish-auth: trusted
        repository-url: git+https://github.com/baldaworks/acpdump.git
        license: MIT
        include-readme: true
        keywords:
          - ai
          - llm
          - acp
          - agent
          - cli
          - dump
