name: omnidist-release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: "go.mod"
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install omnidist
        run: npm install -g '@omnidist/omnidist@0.1.30'
      - name: Build artifacts
        run: omnidist --profile 'acpdump' build
      - name: Stage artifacts
        run: |
          omnidist --profile 'acpdump' npm stage
          node -e '
            const fs = require("fs");
            const path = require("path");
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(full);
                } else if (entry.name === "package.json") {
                  const j = JSON.parse(fs.readFileSync(full, "utf8"));
                  if (j.name !== "@baldaworks/acpdump" && j.bin) {
                    delete j.bin;
                    fs.writeFileSync(full, JSON.stringify(j, null, 2) + "\n");
                    console.log("Removed bin from", full);
                  }
                }
              }
            }
            walk(".omnidist/acpdump/npm");
          '
      - name: Verify artifacts
        run: omnidist --profile 'acpdump' npm verify
      - name: Package GitHub release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p .omnidist/acpdump/release
          tar -czf ".omnidist/acpdump/release/acpdump_${version}_darwin_amd64.tar.gz" -C .omnidist/acpdump/dist/darwin/amd64 acpdump
          tar -czf ".omnidist/acpdump/release/acpdump_${version}_darwin_arm64.tar.gz" -C .omnidist/acpdump/dist/darwin/arm64 acpdump
          tar -czf ".omnidist/acpdump/release/acpdump_${version}_linux_amd64.tar.gz" -C .omnidist/acpdump/dist/linux/amd64 acpdump
          tar -czf ".omnidist/acpdump/release/acpdump_${version}_linux_arm64.tar.gz" -C .omnidist/acpdump/dist/linux/arm64 acpdump
          tar -czf ".omnidist/acpdump/release/acpdump_${version}_windows_amd64.tar.gz" -C .omnidist/acpdump/dist/windows/amd64 acpdump.exe
      - name: Pack staged artifacts
        run: tar -czf omnidist-staged.tgz .omnidist/acpdump
      - name: Upload staged artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: omnidist-staged
          path: omnidist-staged.tgz
      - name: Upload GitHub release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: github-release-assets
          path: .omnidist/acpdump/release/*
          if-no-files-found: error
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: .omnidist/acpdump/dist/**/*
          if-no-files-found: error

  publish_github_release:
    needs: prepare
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Download GitHub release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: github-release-assets
          path: github-release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists; skipping create."
          else
            gh release create "${GITHUB_REF_NAME}" github-release-assets/* --verify-tag --generate-notes
          fi

  publish_npm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_PACKAGE: '@baldaworks/acpdump'
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install omnidist
        run: npm install -g '@omnidist/omnidist@0.1.30'
      - name: Download staged artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: omnidist-staged
      - name: Restore staged artifacts
        run: tar -xzf omnidist-staged.tgz
      - name: Verify artifacts
        run: omnidist --profile 'acpdump' npm verify
      - name: Publish npm artifacts
        run: |
          NPM_VERSION="${GITHUB_REF_NAME#v}"
          if npm view "${NPM_PACKAGE}@${NPM_VERSION}" version >/dev/null 2>&1; then
            echo "${NPM_PACKAGE}@${NPM_VERSION} already exists; skipping publish."
          else
            omnidist --profile 'acpdump' npm publish
          fi
